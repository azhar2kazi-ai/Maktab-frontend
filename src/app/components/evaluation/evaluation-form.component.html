<div class="evaluation-form">
  <h2>{{ isEdit ? 'Edit' : 'New' }} Evaluation</h2>

  <form (ngSubmit)="submitForm()">
    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="evaluation.name" name="name" class="form-control" required />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="evaluation.description" name="description" class="form-control"></textarea>
    </div>

    <!--<div class="form-row">
      <div class="form-group col">
        <label>Max Score</label>
        <input type="number" [(ngModel)]="evaluation.maxScore" name="maxScore" class="form-control" />
      </div>
      <div class="form-group col">
        <label>Passing Score</label>
        <input type="number" [(ngModel)]="evaluation.passingScore" name="passingScore" class="form-control" />
      </div>
    </div>

    <div class="form-group">
      <label>Remarks</label>
      <textarea [(ngModel)]="evaluation.remarks" name="remarks" class="form-control"></textarea>
    </div>-->

    <div class="form-group">
      <label><input type="checkbox" [(ngModel)]="evaluation.active" name="active" /> Active</label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting">{{ isEdit ? 'Update' : 'Create' }}</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
