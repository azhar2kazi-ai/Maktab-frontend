<div class="container my-4">
  <!-- Alert Messages -->
  <div *ngIf="message" class="alert" [ngClass]="messageType === 'success' ? 'alert-success' : 'alert-danger'" role="alert">
    {{ message }}
  </div>

  <!-- Page Header -->
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="mb-3">
        <i class="fas fa-user-plus"></i> Add New Student
      </h2>
      <p class="text-muted">Fill in all the required information to add a new student</p>
    </div>
  </div>

  <!-- Main Form -->
  <form (ngSubmit)="submitForm()">
    <!-- Row 1: Photo Tile -->
    <div class="row g-4 mb-4 justify-content-center">
      <div class="col-12 col-md-3">
        <div class="tile islamic-tile d-flex flex-column h-100">
          <div class="tile-header bg-info text-white text-center py-2">Photo</div>
          <div class="tile-body d-flex flex-column align-items-center justify-content-center flex-grow-1">
            <img
              [src]="getStudentPhotoUrl()"
              alt="Student Photo"
              class="img-fluid rounded-circle shadow-sm mb-3"
              style="max-height: 150px; cursor: pointer;"
              (click)="fileInput.click()">
            <input
              #fileInput
              type="file"
              accept="image/*"
              style="display: none;"
              (change)="onPhotoSelected($event)">

            <!-- Photo Upload/Capture Buttons -->
            <div class="button-group">
              <button
                type="button"
                class="btn btn-sm btn-outline-primary mb-2"
                (click)="fileInput.click()">
                📤 Upload Photo
              </button>
              <button
                type="button"
                class="btn btn-sm btn-outline-info"
                (click)="openCamera()">
                📷 Capture Photo
              </button>
            </div>

            <small class="text-muted mt-2 text-center">
              <em>Click photo to upload or use capture option</em>
            </small>

            <!-- Photo Preview Indicator -->
            <div *ngIf="photoPreview" class="mt-3 text-success">
              <i class="fas fa-check-circle"></i> Photo ready
            </div>
          </div>
        </div>
      </div>

      <!-- Basic Info Tile -->
      <div class="col-12 col-md-4">
        <div class="tile islamic-tile d-flex flex-column h-100">
          <div class="tile-header bg-success text-white text-center py-2">Basic Info</div>
          <div class="tile-body flex-grow-1">
            <!-- Name Row -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="name" class="form-label">First Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" [(ngModel)]="student.name" name="name" maxlength="10" required>
              </div>
              <div class="col-md-6">
                <label for="surName" class="form-label">Last Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="surName" [(ngModel)]="student.surName" name="surName" maxlength="10" required>
              </div>
            </div>

            <!-- Date of Birth and Age Row -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="dateOfBirth" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dateOfBirth" [(ngModel)]="student.dob" name="dateOfBirth">
              </div>
              <div class="col-md-6">
                <label for="age" class="form-label">Age <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="age" [(ngModel)]="student.age" name="age" maxlength="2" min="1" max="99" required>
              </div>
            </div>

            <!-- Gender and Roll No Row -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                <select class="form-control" id="gender" [(ngModel)]="student.gender" name="gender" required>
                  <option>Male</option>
                  <option>Female</option>
                </select>
              </div>
              <!--<div class="col-md-6">
                <label for="rollNo" class="form-label">Roll No</label>
                <input type="number" class="form-control" id="rollNo" [(ngModel)]="student.rollNo" name="rollNo">
              </div>-->
            </div>
          </div>
        </div>
      </div>

      <!-- Class Info Tile -->
      <div class="col-12 col-md-4">
        <div class="tile islamic-tile d-flex flex-column h-100">
          <div class="tile-header bg-warning text-dark text-center py-2">Class & Admission</div>
          <div class="tile-body flex-grow-1">
            <!-- Class Selection -->
            <div class="mb-3">
              <label for="maktabClass" class="form-label">Class <span class="text-danger">*</span></label>
              <select class="form-control" id="maktabClass" [(ngModel)]="student.classId" name="classId" required>
                <option [value]="0" disabled>Select a class</option>
                <option *ngFor="let cls of classes" [value]="cls.id">
                  {{ cls.name }} - {{ cls.division }} ({{ cls.timing }})
                </option>
              </select>
            </div>

            <!-- Admission Date -->
            <div class="mb-3">
              <label for="admissionDate" class="form-label">Admission Date</label>
              <input type="date" class="form-control" id="admissionDate" [(ngModel)]="student.admissionDate" name="admissionDate">
            </div>

            <!-- School Name -->
            <div class="mb-3">
              <label for="schoolName" class="form-label">School Name</label>
              <input type="text" class="form-control" id="schoolName" [(ngModel)]="student.schoolName" name="schoolName" placeholder="e.g., Govt. School, Private School" maxlength="50">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Row 2: Contact & Guardian Info -->
    <div class="row g-4 mb-4 justify-content-center">
      <!-- Contact Info Tile -->
      <div class="col-12 col-md-5">
        <div class="tile islamic-tile d-flex flex-column h-100">
          <div class="tile-header bg-primary text-white text-center py-2">Contact Information</div>
          <div class="tile-body flex-grow-1">
            <!-- Phone -->
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" [(ngModel)]="student.phone" name="phone" placeholder="+91 XXXXX XXXXX" maxlength="10">
            </div>

            <!-- WhatsApp -->
            <div class="mb-3">
              <label for="whatsapp" class="form-label">WhatsApp Number</label>
              <input type="tel" class="form-control" id="whatsapp" [(ngModel)]="student.whatsapp" name="whatsapp" placeholder="+91 XXXXX XXXXX" maxlength="10" >
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <textarea class="form-control" id="address" [(ngModel)]="student.address" name="address" rows="3" placeholder="Full address" maxlength="200"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Guardian Info Tile -->
      <div class="col-12 col-md-5">
        <div class="tile islamic-tile d-flex flex-column h-100">
          <div class="tile-header bg-secondary text-white text-center py-2">Guardian & Parent Details</div>
          <div class="tile-body flex-grow-1">
            <!-- Father Name -->
            <div class="mb-3">
              <label for="fatherName" class="form-label">Father's Name</label>
              <input type="text" class="form-control" id="fatherName" [(ngModel)]="student.fatherName" name="fatherName" maxlength="10">
            </div>

            <!-- Guardian Name -->
            <div class="mb-3">
              <label for="guardianName" class="form-label">Guardian Name</label>
              <input type="text" class="form-control" id="guardianName" [(ngModel)]="student.guardianName" name="guardianName" maxlength="10">
            </div>

            <!-- Parent Profession -->
            <div class="mb-3">
              <label for="parentProfession" class="form-label">Parent's Profession</label>
              <input type="text" class="form-control" id="parentProfession" [(ngModel)]="student.parentProfession" name="parentProfession" placeholder="e.g., Business, Service, Labor" maxlength="10">
            </div>

            <!-- Preferred Time -->
            <div class="mb-3">
              <label for="preferredTime" class="form-label">Preferred Contact Time</label>
              <select class="form-control" id="preferredTime" [(ngModel)]="student.preferredTime" name="preferredTime">
                <option value="">--Select--</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="text-center mb-4">
      <button type="submit" class="btn btn-success mx-2" [disabled]="submitting">
        <span *ngIf="!submitting">
          <i class="fas fa-save"></i> Save Student
        </span>
        <span *ngIf="submitting">
          <span class="spinner-border spinner-border-sm me-2"></span>Saving...
        </span>
      </button>
      <button type="button" class="btn btn-secondary mx-2" (click)="cancel()">
        <i class="fas fa-times"></i> Cancel
      </button>
    </div>
  </form>

  <!-- Camera Modal -->
  <div class="modal fade" [class.show]="showCamera" [style.display]="showCamera ? 'block' : 'none'" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title">Capture Photo</h5>
          <button type="button" class="btn-close btn-close-white" (click)="closeCamera()"></button>
        </div>
        <div class="modal-body">
          <div class="text-center">
            <video #cameraVideo
                   id="cameraVideo"
                   autoplay
                   playsinline
                   muted
                   width="100%" height="400"
                   style="max-height: 400px; border-radius: 8px; background-color: #000; object-fit: cover;">
            </video>
            <p class="text-muted mt-2">Allow camera access if prompted</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeCamera()">Cancel</button>
          <button type="button" class="btn btn-primary" (click)="capturePhoto(cameraVideo)">Capture Photo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Camera Modal Backdrop -->
  <div class="modal-backdrop fade" [class.show]="showCamera" *ngIf="showCamera"></div>
</div>
